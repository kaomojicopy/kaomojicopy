# Netlify builds this site from the GitHub repository.
# The generated pages go to dist/, so source files (data/, templates/, build.js) are never published.
[build]
  command = "node build.js && node check.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  OUT_DIR = "dist"

# The site address (canonical links, sitemap, social cards) comes from Netlify's own URL variable,
# so it updates by itself when you attach a custom domain. To force an address, set SITE_URL in
# Netlify: Site configuration > Environment variables.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
