<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f5ee" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="color-scheme" content="light dark" />
  {{meta}}
  <script>try{var t=localStorage.getItem("kaomoji-copy-theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
{{header}}
  <main id="top">
    <div class="shell page-doc">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / {{crumb}}</nav>
      <h1>{{h1}}</h1>
{{content}}
    </div>
  </main>
{{footer}}
<script src="assets/js/app.js"></script>
</body>
</html>
