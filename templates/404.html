<head>

</head>
<body>
{{header}}

      <h1>That page wandered off.</h1>
      <p>(・_・ヾ We couldn't find that page. <a href="{{root}}index.html" style="text-decoration:underline">Head back home</a> and pick a face.</p>
    </section>
