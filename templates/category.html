<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f5ee" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="color-scheme" content="light dark" />
  {{meta}}
  <script>try{var t=localStorage.getItem("kaomoji-copy-theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{root}}assets/css/style.css" />
  {{jsonld}}
</head>
<body>
{{header}}
  <main id="top">
    <div class="shell">
      <nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>
      <section class="cat-hero">
        <p class="eyebrow">{{eyebrow}}</p>
        <h1>{{h1}}</h1>
        {{intro}}
      </section>
      <div class="cat-tools">
        <div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="filter" type="search" placeholder="{{filter_ph}}..." autocomplete="off" aria-label="{{filter_ph}}" /></div>
        <span class="count"><span id="shown">{{count}}</span> {{unit}}. Tap one to copy.</span>
      </div>
      <div class="kaomoji-grid cat-grid {{grid_extra}}" id="kaomoji-grid" data-page="category">
{{cards}}
      </div>
      <p class="nomatch hidden" id="nomatch">Nothing matches that. Try a shorter word, or pick another collection below. <button class="text-link" id="clear-filter" type="button">Clear filter</button></p>
    </div>
    {{sections}}
    {{related}}
    {{learn}}
    <section class="shell page-sec"><h2>{{pills_title}}</h2><div class="pills">{{pills}}</div></section>
    {{faq}}
  </main>
{{footer}}
<script src="{{root}}assets/js/app.js"></script>
</body>
</html>
